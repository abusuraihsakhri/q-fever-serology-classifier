[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-fever-serology-classifier"
version = "3.0.1"
description = "Educational interpretation of Coxiella burnetii phase I and phase II IFA IgG titers"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0,<3",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0,<3",
    "httpx2>=2.13,<3",
    "build>=1.2",
]

[project.scripts]
q-fever-serology = "cli:main"
q-fever-interpret = "serology_interpreter:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["cli", "q_fever_serology", "serology_interpreter", "enrichment", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
