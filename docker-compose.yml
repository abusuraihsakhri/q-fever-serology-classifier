services:
  q-fever-serology-classifier:
    build: .
    container_name: q-fever-serology-classifier
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # A random key must be explicitly provided in the environment.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a random AUDIT_SECRET_KEY before starting}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
