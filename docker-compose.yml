version: '3.8'

services:
  q-fever-serology-classifier:
    build: .
    container_name: q-fever-serology-classifier
    ports:
      - "8000:8000"
    environment:
      # IMPORTANT: Change this to a cryptographically secure random key in production
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-change-me-to-a-secure-random-key-min-32chars}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
