version: '3.8'

services:
  q-fever-serology-classifier:
    build: .
    container_name: q-fever-serology-classifier
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=q-fever-serology-classifier-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
